<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulazione funnel Inizia Ora — Bozza B + I miei link</title>
<style>
  :root{
    --bg:#0e1621; --chat:#0e1621; --bot:#182533; --user:#2b5278;
    --txt:#f1f5f9; --dim:#8a99a8; --accent:#5288c1; --btn:#17212b; --btnbord:#2f3d4a;
    --green:#4fae4e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#070d14;color:var(--txt);font:15px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
  header{width:100%;max-width:480px;padding:14px 16px 8px;text-align:center}
  header h1{font-size:16px;font-weight:600}
  header p{font-size:12px;color:var(--dim);margin-top:2px}
  .tabs{display:flex;gap:6px;width:100%;max-width:480px;padding:8px 10px}
  .tabs button{flex:1;background:var(--btn);border:1px solid var(--btnbord);color:var(--txt);padding:9px 4px;border-radius:9px;font-size:12.5px;cursor:pointer}
  .tabs button.on{background:var(--accent);border-color:var(--accent);font-weight:600}
  #phone{width:100%;max-width:480px;background:var(--chat);border:1px solid #1c2a38;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;height:72vh;min-height:480px}
  #bar{background:#17212b;padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #0b121b}
  #bar .ava{width:34px;height:34px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700}
  #bar .t{font-size:14px;font-weight:600}
  #bar .s{font-size:11.5px;color:var(--dim)}
  #chat{flex:1;overflow-y:auto;padding:14px 10px 18px;display:flex;flex-direction:column;gap:8px}
  .msg{max-width:86%;padding:8px 12px;border-radius:12px;white-space:pre-wrap;font-size:14.5px;animation:pop .18s ease}
  .bot{background:var(--bot);align-self:flex-start;border-bottom-left-radius:4px}
  .user{background:var(--user);align-self:flex-end;border-bottom-right-radius:4px}
  .sys{align-self:center;background:#131e2a;color:var(--dim);font-size:12px;padding:4px 12px;border-radius:12px}
  .kb{display:flex;flex-direction:column;gap:6px;align-self:stretch;padding:0 2px}
  .kb .row{display:flex;gap:6px}
  .kb button{flex:1;background:var(--btn);border:1px solid var(--btnbord);color:#9fc0e0;padding:9px 8px;border-radius:9px;font-size:13.5px;cursor:pointer}
  .kb button:hover{background:#1f2c39}
  .kb button.sel{background:#24415e;border-color:var(--accent);color:#fff}
  .typing{align-self:flex-start;color:var(--dim);font-size:12.5px;padding:2px 8px}
  .inputrow{display:flex;gap:6px;align-self:stretch}
  .inputrow input{flex:1;background:var(--btn);border:1px solid var(--btnbord);border-radius:9px;color:var(--txt);padding:9px 10px;font-size:14px}
  .inputrow button{background:var(--accent);border:0;border-radius:9px;color:#fff;padding:9px 14px;cursor:pointer}
  .card{background:#13202e;border:1px solid #223345;border-radius:12px;padding:10px 12px;align-self:flex-start;max-width:90%}
  .card h4{font-size:13.5px;margin-bottom:4px}
  .card .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#9fc0e0;background:#0c1620;border-radius:7px;padding:5px 8px;margin:6px 0;word-break:break-all}
  .card .hint{font-size:12px;color:var(--dim)}
  .card .cnt{font-size:12px;color:var(--green);margin-top:4px}
  .cardbtns{display:flex;gap:6px;margin-top:8px}
  .cardbtns button{flex:1;background:var(--btn);border:1px solid var(--btnbord);color:#9fc0e0;padding:7px;border-radius:8px;font-size:12.5px;cursor:pointer}
  footer{max-width:480px;padding:10px 14px 24px;font-size:11.5px;color:var(--dim);text-align:center}
  .restart{margin:4px auto 0;background:none;border:0;color:var(--accent);font-size:12.5px;cursor:pointer}
  @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<header>
  <h1>⛽ Simulazione — bot «Inizia Ora · Accesso»</h1>
  <p>Bozza B (candidatura a 3 passaggi) + link diretto + Pannello «I miei link». Solo demo: nessun dato inviato.</p>
</header>
<div class="tabs">
  <button id="tabA" class="on" onclick="start('completo')">🧲 Lead — percorso completo</button>
  <button id="tabB" onclick="start('diretto')">⚡ Lead — accesso diretto</button>
  <button id="tabC" onclick="start('pannello')">🔗 Agente — I miei link</button>
</div>
<div id="phone">
  <div id="bar"><div class="ava">IO</div><div><div class="t">Inizia Ora · Accesso</div><div class="s">bot</div></div></div>
  <div id="chat"></div>
</div>
<footer>Testi da <b>funnel_v2.md</b> (Bozza B) e <b>tasto_collaboratori.md</b>. La fase 1 community è quella di oggi, invariata.<br><button class="restart" onclick="start(mode)">↺ Ricomincia questa simulazione</button></footer>

<script>
const chat = document.getElementById('chat');
let mode = 'completo';
let nome = 'Marco';
const AG = 'Gaspare';
const RISCHIO = '⚠ Il trading comporta un rischio reale di perdere il capitale: usa solo soldi che puoi permetterti di perdere. I risultati passati non garantiscono quelli futuri.';

function el(cls, html){ const d=document.createElement('div'); d.className=cls; d.innerHTML=html; chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return d; }
function bot(t){ return el('msg bot', t); }
function user(t){ return el('msg user', t); }
function sys(t){ return el('sys', t); }
function clearChat(){ chat.innerHTML=''; }

function typing(ms){ return new Promise(r=>{ const d=el('typing','Inizia Ora · Accesso sta scrivendo…'); setTimeout(()=>{d.remove();r();}, ms); }); }
async function botSay(t, ms=700){ await typing(ms); bot(t); }

// Inline keyboard: rows = [[{t:label, v:value}...]...]; multi = selezione multipla con "Continua"
function kb(rows, {multi=false, done='Continua →'}={}){
  return new Promise(resolve=>{
    const wrap=el('kb','');
    const picked=new Set();
    rows.forEach(r=>{
      const row=document.createElement('div'); row.className='row';
      r.forEach(o=>{
        const b=document.createElement('button'); b.textContent=o.t;
        b.onclick=()=>{
          if(multi){ b.classList.toggle('sel'); b.classList.contains('sel')?picked.add(o.t):picked.delete(o.t); return; }
          wrap.remove(); user(o.t); resolve(o.v??o.t);
        };
        row.appendChild(b);
      });
      wrap.appendChild(row);
    });
    if(multi){
      const row=document.createElement('div'); row.className='row';
      const b=document.createElement('button'); b.textContent=done;
      b.onclick=()=>{ if(!picked.size) return; wrap.remove(); user([...picked].join(' + ')); resolve([...picked]); };
      row.appendChild(b); wrap.appendChild(row);
    }
    chat.scrollTop=chat.scrollHeight;
  });
}
function askText(ph){
  return new Promise(resolve=>{
    const wrap=el('inputrow','');
    const i=document.createElement('input'); i.placeholder=ph;
    const b=document.createElement('button'); b.textContent='Invia';
    const send=()=>{ const v=i.value.trim(); if(!v) return; wrap.remove(); user(v); resolve(v); };
    b.onclick=send; i.onkeydown=e=>{ if(e.key==='Enter') send(); };
    wrap.appendChild(i); wrap.appendChild(b); i.focus(); chat.scrollTop=chat.scrollHeight;
  });
}

async function start(m){
  mode=m;
  ['tabA','tabB','tabC'].forEach(id=>document.getElementById(id).classList.remove('on'));
  document.getElementById(m==='completo'?'tabA':m==='diretto'?'tabB':'tabC').classList.add('on');
  clearChat();
  if(m==='completo') return flussoCompleto();
  if(m==='diretto') return flussoDiretto();
  return pannello();
}

/* ---------- FASE 1 COMMUNITY (oggi, invariata) ---------- */
async function fase1(){
  sys('Il lead apre t.me/&lt;bot&gt;?start=&lt;codice_agente&gt; e preme AVVIA');
  user('/start');
  await botSay('👋 Ciao! Da quale community arrivi?');
  await kb([[{t:'Inizia Ora'}]]);
  await botSay('🌍 In che lingua preferisci continuare?\n\nToccando confermi di avere almeno 18 anni.');
  await kb([[{t:'🇮🇹 Italiano'},{t:'🇬🇧 English'}]]);
  await botSay('Benvenuto in Inizia Ora, '+nome+'. Due domande veloci e ti do l\'accesso alla community.\n\n🎯 Cosa ti interessa? Puoi sceglierne più di una');
  await kb([[{t:'📈 Copy trading automatico'}],[{t:'📊 Sale segnali'}],[{t:'🎓 Imparare a farlo da solo'}]],{multi:true});
  await botSay('🏦 Hai già un conto di trading?');
  await kb([[{t:'No, non ancora'}],[{t:'Sì, con il vostro broker'}],[{t:'Sì, con un altro broker'}]]);
  sys('📇 La scheda lead parte all\'agente (come oggi) — «Entrato da: codice agente»');
  await botSay('✅ Sei già nella community! Quando vuoi, puoi candidarti alla sala VIP.');
  await kb([[{t:'🎯 Candidati alla VIP'}]]);
}

/* ---------- FASE 2 — BOZZA B (3 passaggi) ---------- */
async function bozzaB(){
  await botSay('Ciao '+nome+' 👋 Questa è la tua candidatura alla sala VIP di Inizia Ora.\n\nFunziona così: ogni giorno ricevi i segnali completi — un messaggio con tre numeri: dove entrare, dove fermarti, dove incassare — e li gestiamo in diretta con te, con una persona vera al tuo fianco.\n\n💶 Non paghi nessun abbonamento: l\'accesso si attiva aprendo il conto dal nostro link col broker partner (è così che veniamo pagati: il compenso ce lo riconosce il broker). I soldi restano sul tuo conto, sempre tuoi.\n\n'+RISCHIO+'\n\n3 passaggi e ci siamo (1 minuto).', 900);
  await kb([[{t:'Iniziamo →'}]]);

  await botSay('💶 1/3 — Per la sala VIP serve un conto con almeno 500 $, che restano tuoi sul tuo conto al broker. Ce l\'hai già?');
  const cap = await kb([[{t:'Sì, ce l\'ho'}],[{t:'Li avrò a breve'}],[{t:'Non ancora'}]]);
  if(cap==='Sì, ce l\'ho') await botSay('Ottima scelta 👌 Sei già a metà strada.');
  else await botSay('Perfetto, nessun problema: intanto completa la candidatura, parti quando sei pronto 👌');

  await botSay('📣 2/3 — Ti va di ricevere qui aggiornamenti e novità della community?');
  const cons = await kb([[{t:'Sì, volentieri'},{t:'No grazie'}]]);
  await botSay(cons==='Sì, volentieri' ? 'Grande 🤝 (puoi revocarlo quando vuoi scrivendo STOP)' : 'Nessun problema: nessun messaggio promozionale, solo il tuo percorso.');

  await botSay('✍ 3/3 — Ultima cosa: nome e cognome, così '+AG+' sa chi sei');
  nome = (await askText('Nome e cognome')).split(' ')[0] || nome;

  await botSay('✅ Candidatura accettata, '+nome+'! L\'ultimo passo lo fai con '+AG+': premi qui sotto e manda il messaggio già pronto — ti risponde a breve e ti attiva. Intanto segui i segnali gratuiti nel canale.\n\n🔒 '+AG+' non ti chiede mai soldi: i fondi restano sul tuo conto.\n'+RISCHIO, 900);
  sys('📇 Scheda completa all\'agente: «pronto per la VIP» (bottoni Conto aperto / In VIP / Apri chat)');
  const fin = await kb([[{t:'💬 Scrivi a '+AG}],[{t:'⏩ Simula: il lead NON preme e sparisce'}]]);
  if(fin==='💬 Scrivi a '+AG){
    sys('Si apre la chat con l\'agente, messaggio precompilato. Fine del funnel 🎉');
  } else {
    await followUp();
  }
}

async function followUp(){
  sys('… passano 24 ore senza risposta …');
  await botSay('Ciao '+nome+' 🤝 Ti mancano 30 secondi di candidatura: riprendiamo da dove eri?');
  const r1 = await kb([[{t:'Riprendi'}],[{t:'⏩ Ignora anche questo'}]]);
  if(r1==='Riprendi'){ sys('Il lead riprende dall\'ultimo passo. Recuperato ✅'); return; }
  sys('… passano altre 48 ore …');
  await botSay('Vuoi completare la candidatura o la chiudo? Se preferisci, riprendila quando vuoi.');
  const r2 = await kb([[{t:'Riprendila'},{t:'Chiudila'}]]);
  sys(r2==='Riprendila' ? 'Recuperato al 2° sollecito ✅' : 'Chiusa. Da qui in poi: SILENZIO (mai più di 2 solleciti, niente promozione senza consenso).');
}

async function flussoCompleto(){ await fase1(); await bozzaB(); }

/* ---------- ACCESSO DIRETTO (-vip) ---------- */
async function flussoDiretto(){
  sys('Il contatto caldo apre t.me/&lt;bot&gt;?start=&lt;codice_agente&gt;-vip');
  user('/start');
  await botSay('🌍 In che lingua preferisci continuare?\n\nToccando confermi di avere almeno 18 anni.');
  await kb([[{t:'🇮🇹 Italiano'},{t:'🇬🇧 English'}]]);
  await botSay('⚡ Benvenuto, '+nome+'. Sala segnali VIP: ogni giorno i segnali completi — dove entrare, dove fermarti, dove incassare — gestiti in diretta.\n\nNon paghi nessun abbonamento: l\'accesso si attiva aprendo il conto dal nostro link col broker partner (è così che veniamo pagati). I soldi restano sul tuo conto.\n\n⚠ Il trading comporta un rischio reale di perdere il capitale.\n\nUltimo passo: scrivi a '+AG+', ti attiva lui.', 900);
  sys('📇 Scheda all\'agente con etichetta «⚡ accesso diretto», campi mancanti = «da chiedere in chat»');
  await botSay('Ti va di ricevere qui aggiornamenti della community?');
  await kb([[{t:'Sì, volentieri'},{t:'No grazie'}]]);
  const fin = await kb([[{t:'💬 Scrivi a '+AG}],[{t:'⏩ Simula: non preme'}]]);
  if(fin==='💬 Scrivi a '+AG) sys('Chat con l\'agente aperta. Nessuna domanda in mezzo: il caldo arriva subito 🎉');
  else { await followUp(); }
  sys('NB: il suffisso -vip NON attiva nulla da solo — l\'accesso lo dà sempre lo staff (Conto aperto / In VIP).');
}

/* ---------- PANNELLO AGENTE ---------- */
async function pannello(){
  sys('Il COLLABORATORE apre il Pannello (bottone blu in basso a sinistra) → «🔗 I miei link»');
  const c1=el('card','');
  c1.innerHTML='<h4>🧲 Percorso completo</h4><div class="hint">per chi è freddo: domande + scheda completa</div><div class="mono">https://t.me/&lt;bot&gt;?start=MARIO23</div><div class="cnt">Completo: 41 lead</div><div class="cardbtns"><button onclick="copia(this)">Copia</button><button onclick="inoltra(\'completo\')">Inoltra la card</button></div>';
  const c2=el('card','');
  c2.innerHTML='<h4>⚡ Sala segnali diretto</h4><div class="hint">per chi è già caldo: niente domande, subito l\'ultimo passo</div><div class="mono">https://t.me/&lt;bot&gt;?start=MARIO23-vip</div><div class="cnt">Diretto: 12 lead</div><div class="cardbtns"><button onclick="copia(this)">Copia</button><button onclick="inoltra(\'diretto\')">Inoltra la card</button></div>';
  sys('Contatori per link: ogni agente vede quale rende. Prova i bottoni «Inoltra la card» ↑');
}
function copia(b){ b.textContent='Copiato ✓'; setTimeout(()=>b.textContent='Copia',1200); }
async function inoltra(tipo){
  sys('Il bot manda in chat la card già pronta: l\'agente la INOLTRA al contatto (zero testi da scrivere)');
  if(tipo==='completo')
    bot('🎯 Vuoi entrare nella VIP di Inizia Ora? Candidati qui, ci vuole 1 minuto:\n\n[ Candidati ora ]\n\n⚠ Il trading comporta un rischio reale di perdere il capitale. L\'accesso si attiva aprendo un conto col broker partner, che ci riconosce un compenso.');
  else
    bot('⚡ Accesso diretto alla sala segnali di Inizia Ora — segnali completi ogni giorno, gestiti in diretta:\n\n[ Entra nella sala ]\n\n⚠ Il trading comporta un rischio reale di perdere il capitale. L\'accesso si attiva aprendo un conto col broker partner, che ci riconosce un compenso.');
}

start('completo');
</script>
</body>
</html>
