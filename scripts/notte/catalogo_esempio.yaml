# Catalogo dei compiti notturni di Gas (FASE 4.5). Copialo FUORI dalla cartella Gas:
#   cp ~/Gas/scripts/notte/catalogo_esempio.yaml ~/.gas_notte.yaml
# Gas rifiuta un catalogo dentro la sua cartella (potrebbe riscriverselo da solo).
# Ogni compito parte da zero (cronologia vuota), max 10 compiti per giro.
# Le azioni rischiose NON partono da sole: aspettano la tua firma su Telegram.
# `cervello: forte` (opzionale): il compito usa SOLO il cervello forte (Claude con
# l'abbonamento, serve GAS_CLAUDE_CLI=1); se il forte è fermo il compito aspetta,
# non passa ai modelli gratuiti. Usalo per i lavori importanti o con dati di clienti.
compiti:
  - nome: punto_lead
    prompt: >-
      Usa ricorda con fermi=true per vedere i lead attivi fermi da più tempo,
      poi ricorda con contatto=<nome> sui primi tre per la loro storia.
      Fammi un elenco breve: chi è fermo, da quanti giorni e cosa conviene fare domani.
  - nome: salute_sistema
    prompt: >-
      Usa elenca_cartella sulla cartella di Gas e dimmi in tre righe quali file
      sono stati modificati più di recente (Gas non ha comandi di sistema né git).
    attivo: false
