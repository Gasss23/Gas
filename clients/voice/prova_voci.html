<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prova voci</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* V8 (chat M2): stessi colori della pagina della voce */
:root {
  --bg: #f8f6f2; --surface: #ffffff; --fg: #1c1a16; --muted: #948e85;
  --accent: #b45309; --border: #e8e3db; --ok: #15803d;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0b09; --surface: #141310; --fg: #ede9e1; --muted: #6b6760;
    --accent: #f59e0b; --border: #252219; --ok: #4ade80;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0b09; --surface: #141310; --fg: #ede9e1; --muted: #6b6760;
  --accent: #f59e0b; --border: #252219; --ok: #4ade80;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: "Figtree", system-ui, sans-serif; font-size: 15px; line-height: 1.5;
}
main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 4px; }
p.sotto { color: var(--muted); margin: 0 0 24px; }
label.frase { display: block; font-weight: 500; margin-bottom: 6px; }
select {
  width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); color: var(--fg); font: inherit;
}
#stato { color: var(--muted); margin: 16px 0; min-height: 1.5em; }
#stato.errore { color: #dc2626; }
ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
li {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
}
li.candidata { border-color: var(--accent); }
.nome { font-weight: 600; }
.dettagli { color: var(--muted); font-size: 0.85rem; flex: 1 1 260px; min-width: 0; }
.segno { font-size: 0.75rem; color: var(--accent); font-weight: 600; margin-left: 6px; }
.segno.attuale { color: var(--ok); }
button {
  border: 1px solid var(--border); background: var(--bg); color: var(--fg); font: inherit;
  padding: 6px 12px; border-radius: 8px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button:disabled { opacity: 0.5; cursor: default; }
#scelta {
  margin-top: 24px; padding: 14px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface);
}
code {
  font-family: "JetBrains Mono", monospace; font-size: 0.85rem; word-break: break-all;
  background: var(--bg); padding: 2px 6px; border-radius: 4px;
}
</style>
</head>
<body>
<main>
  <h1>Prova voci</h1>
  <p class="sotto">Ascolta la stessa frase con voci diverse e scegli quella di Gas.
    In cima le candidate: voci maschili, calme, con accento britannico.</p>

  <label class="frase" for="frase">Frase di prova</label>
  <select id="frase"></select>

  <p id="stato" role="status" aria-live="polite">carico le voci…</p>
  <ul id="voci"></ul>

  <div id="scelta" hidden>
    <div>Per usare questa voce metti nel file <code>~/Gas/.env</code> questa riga, poi riavvia il server della voce:</div>
    <p><code id="riga"></code> <button id="copia" type="button">copia</button></p>
  </div>
  <audio id="player"></audio>
</main>
<script>
"use strict";
const statoEl = document.getElementById("stato");
const vociEl = document.getElementById("voci");
const fraseEl = document.getElementById("frase");
const player = document.getElementById("player");
const sceltaEl = document.getElementById("scelta");
const rigaEl = document.getElementById("riga");

function stato(msg, errore = false) {
  statoEl.textContent = msg;
  statoEl.className = errore ? "errore" : "";
}

function scegli(voce) {
  if (voce.id === "piper") {
    rigaEl.textContent = "La voce locale (Piper) per ora si può solo ascoltare: usarla in Gas è una fetta a parte.";
  } else {
    rigaEl.textContent = "ELEVENLABS_VOICE_ID=" + voce.id;
  }
  sceltaEl.hidden = false;
}

async function prova(voce, bottone) {
  bottone.disabled = true;
  stato(`preparo la voce «${voce.nome}»…`);
  try {
    const resp = await fetch("/voci/prova", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ voce: voce.id, frase: Number(fraseEl.value) }) });
    if (!resp.ok) {
      let msg = `${resp.status}`;
      try { msg = (await resp.json()).error || msg; } catch (_) {}
      stato("errore: " + msg, true);
      return;
    }
    const audio = await resp.blob();
    if (player.dataset.url) URL.revokeObjectURL(player.dataset.url);
    player.src = player.dataset.url = URL.createObjectURL(audio);
    stato(`parla «${voce.nome}»`);
    await player.play().catch(() => stato("premi di nuovo «ascolta» (il browser ha bloccato l'audio)", true));
  } catch (e) {
    stato("errore di rete: " + e.message, true);
  } finally {
    bottone.disabled = false;
  }
}

function riga(voce) {
  const li = document.createElement("li");
  if (voce.candidata) li.className = "candidata";
  const testa = document.createElement("div");
  const nome = document.createElement("span");
  nome.className = "nome";
  nome.textContent = voce.nome || voce.id;
  testa.appendChild(nome);
  if (voce.candidata) {
    const s = document.createElement("span");
    s.className = "segno"; s.textContent = "candidata";
    testa.appendChild(s);
  }
  if (voce.attuale) {
    const s = document.createElement("span");
    s.className = "segno attuale"; s.textContent = "in uso";
    testa.appendChild(s);
  }
  const det = document.createElement("div");
  det.className = "dettagli";
  det.textContent = [voce.genere, voce.accento, voce.eta, voce.descrizione, voce.categoria]
    .filter(Boolean).join(" · ");
  const ascolta = document.createElement("button");
  ascolta.type = "button"; ascolta.textContent = "ascolta";
  ascolta.addEventListener("click", () => prova(voce, ascolta));
  const usa = document.createElement("button");
  usa.type = "button"; usa.textContent = "scelgo questa";
  usa.addEventListener("click", () => scegli(voce));
  li.append(testa, det, ascolta, usa);
  return li;
}

document.getElementById("copia").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(rigaEl.textContent); stato("riga copiata"); }
  catch (_) { stato("copia a mano la riga qui sopra", true); }
});

(async () => {
  let dati;
  try {
    const resp = await fetch("/voci/elenco");
    dati = await resp.json();
    if (!resp.ok) throw new Error(dati.error || resp.status);
  } catch (e) {
    stato("non riesco a leggere le voci: " + e.message + " (il server della voce è acceso?)", true);
    return;
  }
  (dati.frasi || []).forEach((f, i) => {
    const o = document.createElement("option");
    o.value = String(i); o.textContent = f;
    fraseEl.appendChild(o);
  });
  const voci = Array.isArray(dati.voci) ? dati.voci.slice() : [];
  if (dati.piper) voci.push({ id: "piper", nome: "Piper (locale, gratis)", descrizione: "gira sul computer, senza internet" });
  voci.forEach(v => vociEl.appendChild(riga(v)));
  if (dati.errore) stato(dati.errore, true);
  else stato(voci.length ? `${voci.length} voci · in uso: ${dati.attuale}` : "nessuna voce trovata", !voci.length);
})();
</script>
</body>
</html>
