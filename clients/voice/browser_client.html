<title>Gas Voice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
:root {
  --bg:           #f8f6f2;
  --surface:      #ffffff;
  --fg:           #1c1a16;
  --muted:        #948e85;
  --accent:       #b45309;
  --accent-glow:  rgba(180, 83, 9, 0.15);
  --rec:          #dc2626;
  --rec-glow:     rgba(220, 38, 38, 0.15);
  --border:       #e8e3db;
  --player-thumb: #b45309;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:           #0c0b09;
    --surface:      #141310;
    --fg:           #ede9e1;
    --muted:        #6b6760;
    --accent:       #f59e0b;
    --accent-glow:  rgba(245, 158, 11, 0.18);
    --rec:          #ef4444;
    --rec-glow:     rgba(239, 68, 68, 0.18);
    --border:       #252219;
    --player-thumb: #f59e0b;
  }
}

:root[data-theme="dark"] {
  --bg:           #0c0b09;
  --surface:      #141310;
  --fg:           #ede9e1;
  --muted:        #6b6760;
  --accent:       #f59e0b;
  --accent-glow:  rgba(245, 158, 11, 0.18);
  --rec:          #ef4444;
  --rec-glow:     rgba(239, 68, 68, 0.18);
  --border:       #252219;
  --player-thumb: #f59e0b;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Figtree', system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-inline: 24px;
  padding-block: 40px;
  gap: 0;
  transition: background 0.3s;
}

/* ─── Wordmark ─── */
.wordmark {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 52px;
  user-select: none;
}
.wordmark-fuel {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}

/* ─── Button + sonar rings ─── */
.btn-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 28px;
}

.ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1.5px solid var(--rec);
  opacity: 0;
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .recording .ring:nth-child(1) { animation: sonar 2s ease-out infinite 0.0s; }
  .recording .ring:nth-child(2) { animation: sonar 2s ease-out infinite 0.65s; }
  .recording .ring:nth-child(3) { animation: sonar 2s ease-out infinite 1.3s; }
}

@keyframes sonar {
  0%   { opacity: 0.55; transform: scale(1);   }
  100% { opacity: 0;    transform: scale(2.6);  }
}

#btn-record {
  position: relative;
  z-index: 1;
  width: 96px;
  height: 96px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  background: var(--accent);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
  box-shadow: 0 2px 20px var(--accent-glow), 0 1px 4px rgba(0,0,0,0.2);
  outline: none;
}

#btn-record:focus-visible {
  box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent);
}

#btn-record:hover:not(:disabled) {
  transform: scale(1.06);
  box-shadow: 0 4px 32px var(--accent-glow), 0 2px 8px rgba(0,0,0,0.25);
}

#btn-record:active:not(:disabled) {
  transform: scale(0.96);
}

#btn-record:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
}

.recording #btn-record {
  background: var(--surface);
  color: var(--rec);
  box-shadow: 0 0 0 2px var(--rec), 0 2px 20px var(--rec-glow);
}

.recording #btn-record:hover:not(:disabled) {
  transform: scale(1.04);
  box-shadow: 0 0 0 2px var(--rec), 0 4px 32px var(--rec-glow);
}

/* Icon swap */
.icon { display: block; pointer-events: none; }
.icon-stop { display: none; }

.recording .icon-mic  { display: none; }
.recording .icon-stop { display: block; }

/* Sending state */
@media (prefers-reduced-motion: no-preference) {
  .sending #btn-record .icon-mic {
    animation: spin 1.1s linear infinite;
    transform-origin: center;
  }
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── Status ─── */
#status {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  font-weight: 400;
  color: var(--muted);
  text-align: center;
  letter-spacing: 0.02em;
  min-height: 1em;
  margin-bottom: 40px;
  transition: color 0.15s;
}

#status.error { color: var(--rec); }
#status.live   { color: var(--accent); }

/* ─── Audio player ─── */
#player-wrap {
  width: 100%;
  max-width: 520px;
  border-top: 1px solid var(--border);
  padding-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.player-label {
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}

audio {
  width: 100%;
  height: 34px;
  border-radius: 4px;
  accent-color: var(--player-thumb);
}

/* ─── Hint ─── */
.hint {
  margin-top: 36px;
  font-size: 0.625rem;
  letter-spacing: 0.08em;
  color: var(--muted);
  text-align: center;
  opacity: 0.6;
  user-select: none;
}

/* ─── V3: conversazione ─── */
.conv-toggle {
  font-size: 0.7rem;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 28px;
  user-select: none;
}
.conv-toggle input { accent-color: var(--accent); }
#testo {
  font-size: 0.9rem;
  line-height: 1.45;
  white-space: pre-wrap;
  max-height: 40vh;
  overflow-y: auto;
}
#testo:empty { display: none; }
</style>

<div class="wordmark">
  <span class="wordmark-fuel" aria-hidden="true"></span>
  Gas Voice
</div>

<div class="btn-wrap" id="btn-wrap">
  <div class="ring" aria-hidden="true"></div>
  <div class="ring" aria-hidden="true"></div>
  <div class="ring" aria-hidden="true"></div>
  <button id="btn-record" aria-label="Registra" aria-pressed="false">
    <!-- Mic icon -->
    <svg class="icon icon-mic" width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <rect x="9" y="2" width="6" height="11" rx="3"/>
      <path d="M5 11a7 7 0 0014 0h-2a5 5 0 01-10 0H5zM11 20v-2.07A7.003 7.003 0 015.05 12H7a5 5 0 009.95 0h1.95A7.003 7.003 0 0113 17.93V20h-2z"/>
    </svg>
    <!-- Stop icon -->
    <svg class="icon icon-stop" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <rect x="5" y="5" width="14" height="14" rx="2"/>
    </svg>
  </button>
</div>

<p id="status" role="status" aria-live="polite">pronto</p>

<label class="conv-toggle">
  <input type="checkbox" id="conv" checked>
  conversazione continua
</label>

<div id="player-wrap" hidden>
  <p class="player-label">risposta</p>
  <p id="testo" aria-live="polite"></p>
  <audio id="player" controls></audio>
</div>

<p class="hint" id="hint">space per parlare</p>

<script>
"use strict";

// V3 (chat M2) — «conversazione filata»: dopo la risposta il microfono resta aperto
// per FINESTRA secondi; se parli il turno parte da solo (fine frase = silenzio), se
// resti zitto la conversazione si chiude con un bip. Dopo ~2 s senza risposta il
// browser dice una frase d'attesa con la voce di sistema (gratis, immediata).

const btnWrap    = document.getElementById("btn-wrap");
const btn        = document.getElementById("btn-record");
const statusEl   = document.getElementById("status");
const playerWrap = document.getElementById("player-wrap");
const player     = document.getElementById("player");
const testoEl    = document.getElementById("testo");
const hint       = document.getElementById("hint");
const convEl     = document.getElementById("conv");

const CFG = {
  finestraS: 12,        // secondi di microfono aperto aspettando che tu parli
  silenzioMs: 1200,     // silenzio che chiude la frase
  maxFraseS: 60,        // tetto di una frase
  sogliaMin: 0.015,     // volume minimo (RMS) che conta come voce
  attesaMs: 2000,       // dopo quanto Gas dice la frase d'attesa
  // V-1 bot #311 / R-577-1-M2: voce continua minima per contare come frase. 250 ms
  // fa passare un «sì» secco; contro il rumore di fondo c'è il tetto dei turni.
  voceMinMs: 250,
  maxTurni: 5,          // turni di fila (il primo è quello del clic), poi serve un clic
  // V4: interruzione mentre Gas parla. Soglia più alta di quella normale e voce continua
  // più lunga, così l'eco della voce di Gas (già ridotta dall'echoCancellation) non basta.
  interruzione: true,
  sogliaInterruzione: 0.06,
  interruzioneMs: 300,
};
const FRASI_ATTESA = ["Ci sto ragionando.", "Un attimo.", "Fammi pensare un secondo."];

if (!window.MediaRecorder || !navigator.mediaDevices?.getUserMedia) {
  setStatus("browser non supportato: serve getUserMedia + MediaRecorder", true);
  btn.disabled = true;
}

let stream = null;       // un solo flusso del microfono per tutta la conversazione
let audioCtx = null;
let analyser = null;
let recorder = null;
let conversazione = false;
let ascolto = null;      // stato dell'ascolto in corso (timer, fasi)
let occupato = false;    // invio o riproduzione in corso
let numTurno = 0;        // R-574-1-M2: solo la riproduzione del turno corrente riapre l'ascolto
let apertura = null;     // R-574-3-M2: una sola richiesta del microfono alla volta
let turniDiFila = 0;     // V-1 bot #311: turni partiti senza un nuovo clic

function setStatus(msg, isError = false, isLive = false) {
  statusEl.textContent = msg;
  statusEl.className = isError ? "error" : isLive ? "live" : "";
}

function setRecordingUI(active) {
  btnWrap.classList.toggle("recording", active);
  btn.setAttribute("aria-pressed", active ? "true" : "false");
  btn.setAttribute("aria-label", active ? "Ferma" : "Parla");
  hint.textContent = active
    ? (conversazione ? "parla pure · clicca per chiudere" : "clicca per fermare e inviare")
    : "space per parlare";
}

function setSendingUI(active) {
  btnWrap.classList.toggle("sending", active);
  btn.disabled = active && !conversazione;
}

function pickMimeType() {
  const candidates = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus",
                      "audio/ogg", "audio/mp4", ""];
  return candidates.find(t => !t || MediaRecorder.isTypeSupported(t)) || "";
}

let bipCtx = null;   // V4 (V-2 bot #311): un solo contesto audio per tutti i bip

function bip(freq = 660, durata = 0.15) {
  try {
    const ctx = bipCtx || (bipCtx = new AudioContext());
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    gain.gain.value = 0.08;
    osc.frequency.value = freq;
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + durata);
  } catch (_) { /* senza audio niente bip: resta il segnale a schermo */ }
}

function volume() {
  const buf = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);
  let somma = 0;
  for (const v of buf) somma += v * v;
  return Math.sqrt(somma / buf.length);
}

async function apriMicrofono() {
  if (stream) return true;
  if (apertura) return apertura;   // doppio clic durante la richiesta del permesso
  apertura = (async () => {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true }, video: false });
    } catch (e) {
      setStatus(e.name === "NotAllowedError" ? "permesso microfono negato"
                                             : "errore microfono: " + e.message, true);
      return false;
    }
    try {
      audioCtx = new AudioContext();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      audioCtx.createMediaStreamSource(stream).connect(analyser);
    } catch (e) {
      // V4 (V-2 bot #311): senza analisi del volume il microfono non resta acceso
      chiudiMicrofono();
      setStatus("errore audio del browser: " + e.message, true);
      return false;
    }
    return true;
  })();
  try { return await apertura; } finally { apertura = null; }
}

function chiudiMicrofono() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; analyser = null; }
}

function fermaAscolto() {
  if (ascolto) { clearInterval(ascolto.timer); ascolto = null; }
}

// Ascolta: in conversazione la frase parte e finisce da sola; senza conversazione
// registra finché non clicchi (comportamento di prima).
// giaInVoce: l'ascolto riparte da un'interruzione, cioè mentre l'operatore sta già
// parlando (R-580-1-M2): niente stima del rumore (sarebbe la sua voce) e frase già iniziata.
async function ascolta(giaInVoce = false) {
  // R-574-1-M2: mai due ascolti insieme, né durante un invio o una riproduzione
  if (ascolto || occupato || (recorder && recorder.state === "recording")) return;
  const inConversazione = conversazione;
  if (!(await apriMicrofono())) { chiudiConversazione(false); return; }
  if (ascolto || occupato || (recorder && recorder.state === "recording")) return;
  // R-575-2-M2: conversazione chiusa mentre il browser chiedeva il permesso → niente
  // registrazione, microfono spento
  if (inConversazione && !conversazione) { chiudiMicrofono(); return; }
  // R-582-1-M2: ogni registrazione ha i suoi pezzi. Con un array condiviso l'ultimo
  // pezzo di un clip scartato (arriva DOPO il riavvio) finiva in testa al clip nuovo,
  // rendendolo un webm indecodificabile.
  const pezzi = [];
  const mimeType = pickMimeType();
  try {
    recorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
  } catch (e) {
    setStatus("errore MediaRecorder: " + e.message, true);
    chiudiConversazione(false);
    return;
  }
  const tipo = recorder.mimeType || "audio/webm";
  let scarta = false;
  recorder.ondataavailable = e => { if (e.data && e.data.size > 0) pezzi.push(e.data); };
  recorder.onstop = () => {
    if (!(recorder && recorder.state === "recording")) setRecordingUI(false);  // non il nuovo
    if (scarta) return;
    turniDiFila += 1;
    invia(new Blob(pezzi, { type: tipo }), tipo.split(";")[0]);
  };
  recorder.start(250);
  setRecordingUI(true);

  if (!conversazione) { setStatus("● in ascolto…", false, true); return; }

  setStatus(`● ti ascolto (${CFG.finestraS} s)…`, false, true);
  const t0 = performance.now();
  // V4 (V-1 bot #311 su c3079f4): il rumore di fondo è la MEDIANA dei primi 300 ms, con
  // un tetto: se rispondi subito («sì») la tua voce non diventa il «rumore» che alza la
  // soglia sopra la tua voce stessa.
  const campioni = [];
  let pavimento = 0;
  let voceDa = null, ultimaVoce = null, parlando = false, voceDopoMs = 0;
  if (giaInVoce) { voceDa = ultimaVoce = t0; parlando = true; setStatus("● parli…", false, true); }
  ascolto = { timer: setInterval(() => {
    if (!analyser) { fermaAscolto(); return; }   // microfono già chiuso
    const ora = performance.now();
    const v = volume();
    if (ora - t0 < 300 && !giaInVoce) {
      campioni.push(v);
      const ord = [...campioni].sort((a, b) => a - b);
      // R-580-3-M2: mediana BASSA, più tollerante con la voce che parte a metà finestra
      pavimento = Math.min(ord[Math.floor((ord.length - 1) / 2)], CFG.sogliaMin * 2);
    }
    const soglia = Math.max(CFG.sogliaMin, pavimento * 3);
    if (v > soglia) {
      voceDopoMs += 50;   // R-581-1-M2: voce vera sentita in QUESTO ascolto
      ultimaVoce = ora;
      if (voceDa === null) voceDa = ora;
      if (!parlando && ora - voceDa > CFG.voceMinMs) { parlando = true; setStatus("● parli…", false, true); }
    } else if (!parlando) {
      voceDa = null;
    }
    if (parlando && (ora - ultimaVoce > CFG.silenzioMs || ora - t0 > CFG.maxFraseS * 1000)) {
      fermaAscolto();
      if (giaInVoce && voceDopoMs < CFG.voceMinMs) {
        // R-581-1-M2: l'interruzione era un rumore breve (tosse, porta): il clip quasi
        // muto non parte (Whisper inventerebbe una frase), si torna ad ascoltare.
        scarta = true;
        recorder.stop();
        ascolta();
        return;
      }
      recorder.stop();          // fine frase: onstop invia
    } else if (!parlando && ora - t0 > CFG.finestraS * 1000) {
      fermaAscolto();
      scarta = true;
      recorder.stop();
      chiudiConversazione(true);
    }
  }, 50) };
}

// V4: mentre Gas parla, in conversazione, il microfono ascolta: se parli sopra la soglia
// di interruzione per interruzioneMs Gas si zittisce e la frase parte subito.
let vigilanza = null;

function fermaVigilanza() {
  if (vigilanza) { clearInterval(vigilanza); vigilanza = null; }
}

function vigila(turno) {
  fermaVigilanza();
  if (!conversazione || !CFG.interruzione || !analyser) return;
  let sopraDa = null;
  vigilanza = setInterval(() => {
    if (!analyser || turno !== numTurno || !conversazione) { fermaVigilanza(); return; }
    const v = volume();
    if (v > CFG.sogliaInterruzione) {
      if (sopraDa === null) sopraDa = performance.now();
      if (performance.now() - sopraDa > CFG.interruzioneMs) {
        fermaVigilanza();
        player.onended = player.onpause = player.onerror = null;
        player.pause();
        occupato = false;
        riapri("mi hai interrotto · ti ascolto…", true);
      }
    } else {
      sopraDa = null;
    }
  }, 50);
}

// Riapre l'ascolto dopo una risposta (o un'interruzione), rispettando il tetto dei turni.
function riapri(msg, giaInVoce = false) {
  // V-1 bot #311: un rumore continuo (TV, altre persone) non può far partire turni
  // all'infinito: dopo maxTurni di fila senza un clic la conversazione si chiude.
  if (conversazione && turniDiFila >= CFG.maxTurni) {
    chiudiConversazione(false);
    setStatus(`conversazione chiusa dopo ${CFG.maxTurni} turni di fila · space per continuare`);
    return;
  }
  if (conversazione) { ascolta(giaInVoce).then(() => { if (ascolto) setStatus(msg, false, true); }); return; }
  chiudiMicrofono();
  setStatus(msg);
}

function chiudiConversazione(perSilenzio) {
  fermaAscolto();
  fermaVigilanza();
  const stavaParlando = conversazione;
  conversazione = false;
  if (recorder && recorder.state === "recording") { recorder.onstop = () => setRecordingUI(false); recorder.stop(); }
  chiudiMicrofono();
  setRecordingUI(false);
  btnWrap.classList.remove("conv");
  if (stavaParlando) bip(440, 0.2);
  if (perSilenzio) setStatus("conversazione chiusa (silenzio) · space per riaprire");
}

async function invia(blob, contentType) {
  occupato = true;
  setSendingUI(true);
  setStatus("invio…");
  let frase = null;
  const timerAttesa = setTimeout(() => {
    if (!window.speechSynthesis) return;
    frase = new SpeechSynthesisUtterance(FRASI_ATTESA[Math.floor(Math.random() * FRASI_ATTESA.length)]);
    frase.lang = "it-IT";
    speechSynthesis.speak(frase);
    setStatus("ci sto ragionando…", false, true);
  }, CFG.attesaMs);
  const t0 = performance.now();
  let resp;
  try {
    resp = await fetch("/voice", { method: "POST", body: blob, headers: {
      "Content-Type": contentType, "Accept": "audio/mpeg", "X-Gas-Formato": "audio+testo" } });
  } catch (e) {
    return fineTurno(timerAttesa, "errore di rete: " + e.message);
  }
  if (!resp.ok) {
    let msg = `${resp.status} ${resp.statusText}`;
    try { msg = (await resp.json()).error || msg; } catch (_) {}
    return fineTurno(timerAttesa, "errore: " + msg);
  }
  let audio, testo = "", voceErr = "";
  const ct = resp.headers.get("Content-Type") || "";
  try {   // R-574-2-M2: risposta rotta → errore dichiarato, la pagina non resta bloccata
    if (ct.startsWith("application/json")) {
      const j = await resp.json();
      testo = j.content || "";
      voceErr = j.errore_voce || "";
      if (j.audio) audio = new Blob([Uint8Array.from(atob(j.audio), c => c.charCodeAt(0))], { type: "audio/mpeg" });
    } else {
      audio = await resp.blob();
    }
  } catch (e) {
    return fineTurno(timerAttesa, "risposta non leggibile: " + e.message);
  }
  clearTimeout(timerAttesa);
  if (window.speechSynthesis) speechSynthesis.cancel();
  const secondi = ((performance.now() - t0) / 1000).toFixed(1);
  testoEl.textContent = testo;
  playerWrap.hidden = false;
  setSendingUI(false);
  if (!audio) {
    occupato = false;
    return dopoRisposta(`risposta solo testo · ${secondi}s` + (voceErr ? ` (${voceErr})` : ""));
  }
  if (player.dataset.prevUrl) URL.revokeObjectURL(player.dataset.prevUrl);
  player.src = player.dataset.prevUrl = URL.createObjectURL(audio);
  setStatus(`Gas parla · ${secondi}s`, false, true);
  const turno = ++numTurno;
  player.onended = () => {          // una volta sola: un riascolto non riapre niente
    player.onended = player.onpause = player.onerror = null;
    fermaVigilanza();
    if (turno !== numTurno) return;
    occupato = false;
    dopoRisposta("pronto");
  };
  // R-576-2-M2: audio rotto a metà (nessun «ended» né «pause») → turno chiuso, tasto libero
  player.onerror = () => {
    player.onended = player.onpause = player.onerror = null;
    fermaVigilanza();
    if (turno !== numTurno) return;
    occupato = false;
    chiudiConversazione(false);
    setStatus("audio della risposta non riproducibile · il testo è a schermo", true);
  };
  // R-575-1-M2: pausa dai controlli del player → turno finito, conversazione chiusa
  // (un riascolto dopo non riapre niente: i gestori valgono una volta sola)
  player.onpause = () => {
    if (player.ended) return;       // la fine arriva anche come pausa: ci pensa onended
    player.onended = player.onpause = player.onerror = null;
    fermaVigilanza();
    if (turno !== numTurno) return;
    occupato = false;
    chiudiConversazione(false);
    setStatus("risposta in pausa · conversazione chiusa");
  };
  try {
    await player.play();
    if (turno === numTurno && occupato) vigila(turno);   // V4: interruzione possibile
  } catch (_) {
    if (turno !== numTurno || !occupato) return;   // turno già chiuso (es. pausa subito)
    if (player.error) { player.onerror(); return; }   // audio rotto, non autoplay negato
    // R-574-3-M2: senza riproduzione automatica la conversazione si chiude e il
    // microfono si spegne; la risposta resta da ascoltare col tasto play.
    player.onended = player.onpause = player.onerror = null;
    occupato = false;
    chiudiConversazione(false);
    chiudiMicrofono();
    setStatus(`${secondi}s · premi play ↑`);
  }
}

function fineTurno(timerAttesa, errore) {
  clearTimeout(timerAttesa);
  if (window.speechSynthesis) speechSynthesis.cancel();
  occupato = false;
  setSendingUI(false);
  chiudiConversazione(false);
  setStatus(errore, true);
}

function dopoRisposta(msg) {
  fermaVigilanza();
  if (conversazione && turniDiFila < CFG.maxTurni) { ascolta(); return; }   // si riapre da sola
  riapri(msg);
}

btn.addEventListener("click", async () => {
  if (conversazione) { chiudiConversazione(false); setStatus("conversazione chiusa"); return; }
  if (recorder && recorder.state === "recording") { recorder.stop(); setStatus("elaborazione…"); return; }
  if (occupato) return;
  conversazione = convEl.checked;
  turniDiFila = 0;   // un clic è il «sì, continua» dell'operatore
  if (conversazione) { btnWrap.classList.add("conv"); bip(880, 0.08); }
  await ascolta();
});

document.addEventListener("keydown", e => {
  if (e.code !== "Space") return;
  if (["INPUT", "TEXTAREA", "BUTTON", "SELECT"].includes(document.activeElement?.tagName)) return;
  e.preventDefault();
  btn.click();
});

// Configurazione dal proxy (GAS_VOICE_FINESTRA): se manca restano i valori di default.
fetch("/config").then(r => r.ok ? r.json() : {}).then(c => {
  if (Number.isFinite(c.finestra) && c.finestra > 0) CFG.finestraS = c.finestra;
  if (Number.isInteger(c.max_turni) && c.max_turni > 0) CFG.maxTurni = c.max_turni;
  if (typeof c.interruzione === "boolean") CFG.interruzione = c.interruzione;
}).catch(() => {});
</script>
